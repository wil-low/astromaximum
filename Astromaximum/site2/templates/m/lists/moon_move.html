{% extends "m/base.html" %}
{% load list_extras %}
{% block title %}Moon move{% endblock %}

{% block content %}
    <div class="lowtab">
        {% for ev in event_list %}
        <div>{{ ev|moon_move:date_range }}</div>
        {% endfor %}
    </div>
    {% if settings.DEBUG %}
        <div class="clear">
        <h2>Moon move</h2>
        {% for ev in event_list %} 
            <p>{{ ev }}</p>
        {% endfor %}
        </div>
    {% endif %}
{% endblock %}

<?xml version="1.0" encoding="UTF-8" ?><!DOCTYPE html PUBLIC "-//WAPFORUM//DTD XHTML Mobile 1.0//EN" "http://www.wapforum.org/DTD/xhtml-mobile10.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>{% block title %}Base list {% endblock %} - Astromaximum</title>
<link href="/i/main.css" rel="stylesheet" type="text/css"/>
<meta name="format-detection" content="telephone=no" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-touch-fullscreen" content="yes" />
<meta name="HandheldFriendly" content="true" />
<meta name="MobileOptimized" content="width" />
</head>
<body>
    <div class="hdr">
        {% block hdr %}
        <a href="summary">Summary</a>
        <a href="../{{ prev_date }}/{{ page_name }}">&lt;&lt;</a>
        {{ date_range.0|date:"d M Y" }}
        <a href="../{{ next_date }}/{{ page_name }}">&gt;&gt;</a>
        (<a href="../{{ now|date:'Y-m-d'' }}">{{ now|date:'d M Y, H:i' }}</a>)
        {% endblock %}
    </div>
    {% block content %}
	{% endblock %}
    <div class="ftr">
        Kiev <a href="../settings">Settings</a>
    </div>
</body>
</html>

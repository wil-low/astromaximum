<script src="/i/dl.js" type="text/javascript"></script>

{% endblock %}

{% block content %}

<div>
<form method="post" action="/geo" name="main">
{% csrf_token %}
<table class="colorlist">
<tr><th><b>Step 1</b>.
<select name="y_sel" style="height:auto; width:auto;"
    onchange="document.forms.namedItem('main').submit()">
<option value="2011" selected="selected">2011</option>
</select>
</th>
<th colspan="2">
<span style="white-space: nowrap; font-size:11px">
</span>
</th>
</tr>
<tr>
<th><b>Step 2</b>.
Country</th>
<th><b>Step 3</b>.
State</th>
<th>
<span class="bums">
<input id="genbtn" type="button" value="make midlet" onclick="generate()"/>
</span>
</th>
</tr>
<tr>
<td><!-- 1st listbox -->
<select id="countries" name="countries" size="18" onchange="showc(1,this)" class="lb">
</select>
</td>
<td><!-- 2nd listbox -->
<select name="states" size="18" onchange="showc(2,this)" class="lb">
</select>
</td>
<td><!-- 3rd listbox -->
<select name="cities" id="chkcit" size="18" class="lb" onchange="highlight_gen(true)">
</select>
<input type="hidden" name="Action" value=""/>
<input type="hidden" name="cid" value="0"/>
<input type="hidden" name="stateid" value="0"/>
<input type="hidden" name="sc" value=","/>
<input type="hidden" name="lang" value="en"/>
</td>
</tr>
</table>
</form>
<p><a href="demo">The calendar for appropriate year</a> must be installed on your phone before installing cities.</p>
</div>
